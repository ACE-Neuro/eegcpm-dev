# GOLDEN CONFIG — preprocessing (spec §3.i + §3.s)
# YAML only SELECTS the canonical chain; the chain itself is defined in
# code by build_hbn_langer_chain() (eegcpm/modules/preprocessing/
# hbn_langer_chain.py) and the per-step parameters below are recorded
# there. The blocks at the bottom of this file are documentation of the
# pinned values, NOT consumed configuration — do not re-introduce them
# as real keys (the schema forbids unknown keys).
#
# P1-F7: the preprocessing stage is pinned by the *resolved* config hash
# (`resolved_config_hash(PreprocessingPipeline('hbn_langer'))`, literal in
# eegcpm/core/config_hash.py::GOLDEN_RESOLVED_HASHES), not by this file's
# bytes — a chain or step-parameter change breaks the golden-hash test;
# editing comments here does not.
#
# Per-dataset tuning of the named chain (plan §12.6) goes through an optional
# `chain_params:` block; omitting it resolves to the pinned defaults above.
# Example (not enabled here — the defaults are the golden chain):
#
# chain_params:
#   asr_cutoff: 20.0                    # EEGLAB conservative
#   asr_drift_transition_hz: [0.25, 0.75]  # null disables the high-pass (non-EEGLAB)
#   asr_max_dims: 0.66
#   asr_calibration: fixed_first_60s    # or data_driven (EEGLAB auto calibration)
stage: preprocessing
variant: hbn_langer
description: Deterministic Langer+ASR chain (code-defined; see build_hbn_langer_chain)
steps: hbn_langer        # named chain -> build_hbn_langer_chain()
is_primary: true

