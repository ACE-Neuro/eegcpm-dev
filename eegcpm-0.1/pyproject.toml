[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegcpm"
version = "0.1.0"
description = "EEG Connectome Predictive Modeling Toolbox"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "EEGCPM Team"}
]
keywords = ["EEG", "connectivity", "predictive modeling", "neuroscience", "MNE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "mne>=1.0",
    "mne-icalabel>=0.4",
    "nibabel>=4.0",
    "onnxruntime>=1.15",
    "scikit-learn>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pyzaplineplus>=0.1.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.20",
    "plotly>=5.0",
]
neural = [
    "torch>=2.0",
]
asr = [
    "eegprep>=0.0.4",
    "eeglabio>=0.1.3",
]
pipeline = [
    # The verified pipeline environment (P1-F21). Exact pins: the golden
    # resolved-config hash covers these library versions, so a bump must be
    # deliberate (re-pin GOLDEN_RESOLVED_HASHES after any change; see
    # eegcpm/core/config_hash.py for the one-liner).
    # NEW-5 (B6 rev2): numpy/scipy pinned too — mne's filter/PSD/SVD numerics
    # are what the detector and the resolved hash depend on.
    "numpy==2.5.4",
    "scipy==1.18.1",
    "mne==1.13.2",
    "mne-icalabel==0.10.0",
    "eegprep==0.4.0",
    "pyzaplineplus==0.1.0",
    "eeglabio==0.1.4",
    "autoreject==0.5.1",
    # CI parity: pandas needs a parquet engine for the features CLI; it was
    # only present transitively in the dev venv (CI failure 2026-10-16).
    "pyarrow==25.0.1",
]
all = [
    "streamlit>=1.20",
    "streamlit-local-storage==0.0.25",
    "plotly>=5.0",
    "torch>=2.0",
    "autoreject>=0.4",
    "networkx>=2.8",
    "eegprep>=0.0.4",
    "eeglabio>=0.1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "streamlit-local-storage==0.0.25"
]

[project.scripts]
eegcpm = "eegcpm.cli:main"

[project.urls]
Homepage = "https://github.com/eegcpm/eegcpm"
Documentation = "https://eegcpm.readthedocs.io"
Repository = "https://github.com/eegcpm/eegcpm"

[tool.setuptools.packages.find]
where = ["."]
include = ["eegcpm*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=eegcpm --cov-report=term-missing"
markers = [
    "slow: >30 s",
    "fsaverage: needs cached fsaverage",
    "chain_e2e: full hbn_langer chain",
]
